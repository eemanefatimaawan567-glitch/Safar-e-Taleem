<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Safar-e-Taleem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body.auth-page {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 36px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.3rem;
            color: #0f172a;
            margin-bottom: 16px;
        }
        .brand-mark {
            background: #10b981;
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .auth-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            margin: 0 0 6px 0;
            color: #0f172a;
        }
        .auth-header p {
            color: #64748b;
            font-size: 0.875rem;
            text-align: center;
            margin: 0 0 24px 0;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }
        .form-group label {
            font-size: 0.825rem;
            font-weight: 600;
            color: #0f172a;
        }
        .form-group input, .form-group select {
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #059669; }
        .auth-footer {
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 20px;
        }
        .auth-footer a { color: #059669; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="auth-header">
        <div class="brand-logo">
            <div class="brand-mark"><i class="fa-solid fa-route"></i></div>
            <span>Safar-e-Taleem</span>
        </div>
        <h2>Sign In</h2>
        <p>Access your school mobility dashboard</p>
    </div>

    {% if error %}
    <div style="background: #fef2f2; color: #991b1b; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px;">
        <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
    </div>
    {% endif %}

    <form action="/login" method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="e.g. parent@demo.com" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <div class="auth-footer">
        Don't have an account? <a href="/register">Register here</a>
    </div>
</div>

</body>
</html>
